<!doctype html>
<!-- lang="id" memberi tahu Google bahwa isi situs ini berbahasa Indonesia -->
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ==========================================================
       SEMUA NILAI DI BAWAH DIISI OTOMATIS DARI site.config.js
       Jangan diketik manual di sini - ubah di file itu saja.
       ========================================================== -->

  <title>__SITE_TITLE__</title>
  <meta name="description" content="__SITE_DESCRIPTION__" />
  <meta name="author" content="__SITE_NAME__" />
  <link rel="canonical" href="__SITE_URL__/" />

  <!-- Izinkan Google mengindeks & menampilkan preview gambar besar -->
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

  <!-- Preview saat link dibagikan di WhatsApp, Facebook, Instagram -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="__SITE_NAME__" />
  <meta property="og:locale" content="id_ID" />
  <meta property="og:title" content="__SITE_TITLE__" />
  <meta property="og:description" content="__SITE_DESCRIPTION__" />
  <meta property="og:url" content="__SITE_URL__/" />
  <meta property="og:image" content="__OG_IMAGE__" />
  <meta property="og:image:width" content="__OG_IMAGE_WIDTH__" />
  <meta property="og:image:height" content="__OG_IMAGE_HEIGHT__" />
  <meta property="og:image:alt" content="Logo __SITE_NAME__" />

  <!-- Preview saat link dibagikan di X/Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="__SITE_TITLE__" />
  <meta name="twitter:description" content="__SITE_DESCRIPTION__" />
  <meta name="twitter:image" content="__OG_IMAGE__" />

  <!-- Ikon & warna tab browser -->
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <meta name="theme-color" content="#0f172a" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Roboto:wght@300;400;500&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
